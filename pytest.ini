[pytest]
pythonpath = .
filterwarnings =
    ignore:coroutine 'AsyncConnection.run_sync' was never awaited:RuntimeWarning
asyncio_mode = strict
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    users: marks tests related to users
    create: marks tests for creating users
    get: marks tests for fetching users
    update: marks tests for updating users
    delete: marks tests for deleting users
    me: marks tests relating to me route
