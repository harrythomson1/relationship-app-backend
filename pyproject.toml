[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","UP","B","C4","SIM"]
ignore = ["E501"]  # handled by Black

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402"]  # load_dotenv must run before app imports
