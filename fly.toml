# fly.toml app configuration file generated for anywhere-backend on 2025-12-07T10:54:30+05:45
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'anywhere-backend'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
